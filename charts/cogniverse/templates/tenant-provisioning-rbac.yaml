{{- if .Values.tenantProvisioning.enabled }}
# Account for workflows/tenant-provisioning.yaml. Its resource steps create
# and read back the tenant's Namespace, ResourceQuota and PersistentVolumeClaim.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cogniverse-tenant-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cogniverse.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cogniverse-tenant-provisioning
  labels:
    {{- include "cogniverse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cogniverse-tenant-provisioning
  labels:
    {{- include "cogniverse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: cogniverse-tenant-provisioning
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cogniverse-tenant-provisioning
{{- end }}
