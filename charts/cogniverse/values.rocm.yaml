

_vllmRocmImage: &vllmRocmImage
  rocm:
    repository: vllm/vllm-openai-rocm
    tag: v0.23.0
    pullPolicy: IfNotPresent

# This host shares one memory pool between CPU and GPU, and the enabled
# models' --gpu-memory-utilization fractions sum past 1.0, so nothing here
# survives all of them reserving at once. Ordered by descending reservation:
# the largest allocation lands first, against an unfragmented pool.
inferenceStartup:
  sequence:
    - vllm_llm_teacher
    - vllm_colpali
    - vllm_llm_student
    - vllm_asr
    - denseon
    - colbert_pylate
    - code_colbert_pylate

inference:
  vllm_colpali:
    enabled: true
    model: TomoroAI/tomoro-colqwen3-embed-4b
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    engine: vllm_token_embed
    extraArgs:
      # Equal to --max-num-batched-tokens below: chunked prefill is off for
      # this CLS-pooled model, so vLLM refuses a context longer than a step.
      # The largest request, one 1024-token image, is 1031 tokens.
      - "--max-model-len"
      - "1536"
      - "--runner"
      - "pooling"
      - "--convert"
      - "embed"
      - "--limit-mm-per-prompt"
      - '{"video":0,"image":1}'
      # Fractional allocation rejects this multimodal model because its
      # startup image profile temporarily exceeds the steady-state budget.
      # Reserve the small decoder cache explicitly and cap the processor at
      # the 1024 visual patches supported by the Vespa document contract.
      - "--kv-cache-memory-bytes"
      - "1G"
      - "--mm-processor-kwargs"
      - '{"max_pixels":1048576}'
      # vLLM still applies its initial free-memory guard when an explicit
      # cache size is present, although the fraction no longer sizes the
      # cache. Keep the guard below the steady-state free-memory floor.
      # 0.18 = 17.3 GiB of the 96 GiB pool: 8 GiB of bf16 weights for a 4B
      # model, the 1 GiB cache pinned above, and one step's activation
      # workspace: one 1024-patch image through the vision encoder and at
      # most 1536 tokens through the decoder.
      - "--gpu-memory-utilization"
      - "0.18"
      # Sixteen concurrent queries share one forward pass. The step budget
      # also sizes the vision batch, at startup profiling and at run time,
      # as budget // 1024 images; 1536 keeps that at one image.
      - "--max-num-seqs"
      - "16"
      - "--max-num-batched-tokens"
      - "1536"
      # A step of up to 512 tokens (sixteen 32-token queries) pads to a
      # captured graph size, so query traffic runs a fixed set of GEMM
      # shapes that the TunableOp results file already holds.
      - "--max-cudagraph-capture-size"
      - "512"
    # Batched step lengths vary with the mix of queries and images, and
    # tuning a shape the results file lacks stalls the engine (31 s for one
    # new image length). Tuned shapes still apply; new ones run the default
    # kernel.
    tunableOpTuning: false
    kvCacheGiB: null
    image: null
    resources:
      limits:
        cpu: "4"
        memory: "20Gi"
      requests:
        cpu: "4"
        memory: "20Gi"

  vllm_asr:
    device: rocm
    gpuCount: 1
    extraArgs:
      - "--runner"
      - "generate"
      - "--max-model-len"
      - "448"
      # 0.04 = 3.84 GiB: 1.6 GiB of bf16 weights for whisper-large-v3-turbo
      # (809M) plus the encoder's mel workspace. The KV cache is negligible
      # at a 448-token context and one sequence.
      - "--gpu-memory-utilization"
      - "0.04"
      - "--max-num-seqs"
      - "1"
      - "--max-num-batched-tokens"
      - "2048"
      - "--async-scheduling"
    resources:
      limits:
        cpu: "2"
        memory: "6Gi"
      requests:
        cpu: "2"
        memory: "6Gi"

  vllm_llm_student:
    enabled: true
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    # Helm REPLACES list values, so this overlay must repeat every base
    # extraArg. --max-num-seqs and --limit-mm-per-prompt were silently
    # dropped when only the ROCm-specific args were listed here, leaving the
    # student on max-num-seqs=256 + an unbounded multimodal host cache
    # (gemma-4 is a vision-language model) — the source of the 9->15Gi host
    # RSS ratchet.
    #
    # --max-num-seqs 8: the KV pool reserved by gpu-memory-utilization 0.30
    # (~12.6 GiB / 353k tokens) profiles at 21.5x concurrency for full
    # 16k-token requests and far more for typical shorter agent prompts, so
    # it sits idle at max-num-seqs=1. 8 draws on that already-reserved pool
    # (zero extra GPU memory) to batch the concurrent multi-tenant agent
    # load; host-side per-seq state stays bounded (MALLOC_ARENA_MAX caps the
    # arena ratchet). Do NOT restore the 256 default.
    # --limit-mm-per-prompt: allow up to 4 still images (the answer agents'
    # keyframes on the multimodal generation path); video stays 0 — profiling
    # video encoder cache is what blows memory, still images are bounded. Keep
    # image >= the agents' max_keyframes_to_llm (default 4).
    extraArgs:
      - "--max-model-len"
      - "16384"
      - "--enforce-eager"
      # 0.22 = 21.1 GiB: ~16 GiB of weights plus a KV pool sized for the
      # max-num-seqs 8 x 16384-token working set below, with activation
      # headroom. The previous 0.30 reserved a KV pool roughly five times
      # the configured concurrency could consume.
      - "--gpu-memory-utilization"
      - "0.22"
      - "--max-num-seqs"
      - "8"
      - "--limit-mm-per-prompt"
      - '{"video":0,"image":4}'
    resources:
      limits:
        cpu: "4"
        memory: "24Gi"
      requests:
        cpu: "4"
        memory: "24Gi"

  # Qwen3 14B at AWQ-INT4 needs ~9.29 GiB of weights before any KV cache.
  # Resident alongside the serving set: the enabled fractions sum to 0.66 of
  # the pool with it. Required by the DSPy compile path, which builds
  # teacher_settings for every optimization job.
  vllm_llm_teacher:
    enabled: true
    replicaCount: 1
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    extraArgs:
      - "--max-model-len"
      - "4096"
      - "--enforce-eager"
      # 0.20 = 19.2 GiB against the 96 GiB pool: 9.3 GiB of AWQ weights
      # plus activation and a 4096-token cache at max-num-seqs 1. vLLM
      # charges this budget against its own process only.
      - "--gpu-memory-utilization"
      - "0.20"
      - "--max-num-seqs"
      - "1"
    resources:
      limits:
        cpu: "4"
        memory: "20Gi"
      requests:
        cpu: "4"
        memory: "20Gi"

  # PyLate pods reuse the locally built cogniverse/pylate image — the
  # build bakes the host's torch backend (rocm here), so no per-device
  # image override is needed. device: rocm still drives the kfd/dri
  # mounts and maps DEVICE to torch's cuda namespace.
  colbert_pylate:
    enabled: true
    device: rocm
    gpuCount: 1
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"

  code_colbert_pylate:
    enabled: true
    device: rocm
    gpuCount: 1
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"

  denseon:
    enabled: true
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    extraArgs:
      - "--gpu-memory-utilization"
      - "0.05"
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"

runtime:
  backend: rocm
  tunableOp: true

llm:
  engine: vllm
  model: google/gemma-4-e4b-it
  builtin:
    enabled: false

config:
  defaultProfiles:
    video: video_colpali_smol500_mv_frame
