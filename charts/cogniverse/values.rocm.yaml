

_vllmRocmImage: &vllmRocmImage
  rocm:
    repository: vllm/vllm-openai-rocm
    tag: v0.23.0
    pullPolicy: IfNotPresent

# This host shares one memory pool between CPU and GPU, and the enabled
# models' --gpu-memory-utilization fractions sum past 1.0, so nothing here
# survives all of them reserving at once. Ordered by descending reservation:
# the largest allocation lands first, against an unfragmented pool.
inferenceStartup:
  sequence:
    - vllm_llm_teacher
    - vllm_colpali
    - vllm_llm_student
    - vllm_asr
    - denseon
    - colbert_pylate
    - code_colbert_pylate

inference:
  vllm_colpali:
    enabled: true
    model: TomoroAI/tomoro-colqwen3-embed-4b
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    engine: vllm_token_embed
    extraArgs:
      - "--max-model-len"
      - "4096"
      - "--runner"
      - "pooling"
      - "--convert"
      - "embed"
      - "--limit-mm-per-prompt"
      - '{"video":0,"image":1}'
      # Fractional allocation rejects this multimodal model because its
      # startup image profile temporarily exceeds the steady-state budget.
      # Reserve the small decoder cache explicitly and cap the processor at
      # the 1024 visual patches supported by the Vespa document contract.
      - "--kv-cache-memory-bytes"
      - "1G"
      - "--mm-processor-kwargs"
      - '{"max_pixels":1048576}'
      # vLLM still applies its initial free-memory guard when an explicit
      # cache size is present, although the fraction no longer sizes the
      # cache. Keep the guard below the steady-state free-memory floor.
      # 0.18 = 17.3 GiB of the 96 GiB pool: 8 GiB of bf16 weights for a 4B
      # model, the 1 GiB cache pinned above, and the vision encoder's
      # activation workspace at 1024 visual patches.
      - "--gpu-memory-utilization"
      - "0.18"
      - "--max-num-seqs"
      - "1"
    kvCacheGiB: null
    image: null
    resources:
      limits:
        cpu: "4"
        memory: "20Gi"
      requests:
        cpu: "4"
        memory: "20Gi"

  vllm_asr:
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    extraArgs:
      - "--runner"
      - "generate"
      - "--max-model-len"
      - "448"
      # 0.04 = 3.84 GiB: 1.6 GiB of bf16 weights for whisper-large-v3-turbo
      # (809M) plus the encoder's mel workspace. The KV cache is negligible
      # at a 448-token context and one sequence.
      - "--gpu-memory-utilization"
      - "0.04"
      - "--max-num-seqs"
      - "1"
      - "--max-num-batched-tokens"
      - "2048"
    resources:
      limits:
        cpu: "2"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "8Gi"

  vllm_llm_student:
    enabled: true
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    # Helm REPLACES list values, so this overlay must repeat every base
    # extraArg. --max-num-seqs and --limit-mm-per-prompt were silently
    # dropped when only the ROCm-specific args were listed here, leaving the
    # student on max-num-seqs=256 + an unbounded multimodal host cache
    # (gemma-4 is a vision-language model) — the source of the 9->15Gi host
    # RSS ratchet.
    #
    # --max-num-seqs 8: the KV pool reserved by gpu-memory-utilization 0.30
    # (~12.6 GiB / 353k tokens) profiles at 21.5x concurrency for full
    # 16k-token requests and far more for typical shorter agent prompts, so
    # it sits idle at max-num-seqs=1. 8 draws on that already-reserved pool
    # (zero extra GPU memory) to batch the concurrent multi-tenant agent
    # load; host-side per-seq state stays bounded (MALLOC_ARENA_MAX caps the
    # arena ratchet). Do NOT restore the 256 default.
    # --limit-mm-per-prompt: allow up to 4 still images (the answer agents'
    # keyframes on the multimodal generation path); video stays 0 — profiling
    # video encoder cache is what blows memory, still images are bounded. Keep
    # image >= the agents' max_keyframes_to_llm (default 4).
    extraArgs:
      - "--max-model-len"
      - "16384"
      - "--enforce-eager"
      # 0.22 = 21.1 GiB: ~16 GiB of weights plus a KV pool sized for the
      # max-num-seqs 8 x 16384-token working set below, with activation
      # headroom. The previous 0.30 reserved a KV pool roughly five times
      # the configured concurrency could consume.
      - "--gpu-memory-utilization"
      - "0.22"
      - "--max-num-seqs"
      - "8"
      - "--limit-mm-per-prompt"
      - '{"video":0,"image":4}'
    resources:
      limits:
        cpu: "4"
        memory: "32Gi"
      requests:
        cpu: "4"
        memory: "32Gi"

  # Qwen3.6-27B at AWQ-INT4 needs ~14.5 GiB of weights before any KV cache.
  # Added to the serving set it puts the pool past the budget above, so it is
  # not resident on this host. Enable it for a distillation run, which scales
  # the serving models it does not need down first.
  vllm_llm_teacher:
    enabled: false
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    extraArgs:
      - "--max-model-len"
      - "4096"
      - "--enforce-eager"
      # 0.17 = 16.3 GiB, sized for the INT4 weights plus a 4096-token cache
      # at low concurrency. Only applies while the service is enabled.
      - "--gpu-memory-utilization"
      - "0.17"
      - "--max-num-seqs"
      - "1"
      - "--limit-mm-per-prompt"
      - '{"image":0,"video":0}'
    resources:
      limits:
        cpu: "4"
        memory: "32Gi"
      requests:
        cpu: "4"
        memory: "32Gi"

  # PyLate pods reuse the locally built cogniverse/pylate image — the
  # build bakes the host's torch backend (rocm here), so no per-device
  # image override is needed. device: rocm still drives the kfd/dri
  # mounts and maps DEVICE to torch's cuda namespace.
  colbert_pylate:
    enabled: true
    device: rocm
    gpuCount: 1
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"

  code_colbert_pylate:
    enabled: true
    device: rocm
    gpuCount: 1
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"

  denseon:
    enabled: true
    device: rocm
    gpuCount: 1
    imagesByDevice: *vllmRocmImage
    extraArgs:
      - "--gpu-memory-utilization"
      - "0.05"
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "4Gi"

runtime:
  backend: rocm
  tunableOp: true

dashboard:
  backend: rocm

llm:
  engine: vllm
  model: google/gemma-4-e4b-it
  builtin:
    enabled: false
