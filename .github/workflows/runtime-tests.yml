name: Runtime Module Tests

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'libs/runtime/**'
      - 'libs/core/**'
      - 'libs/foundation/**'
      - 'configs/schemas/**'
      - 'configs/agent_policies/**'
      - 'workflows/**'
      - 'tests/runtime/**'
      - 'tests/admin/**'
      - 'tests/events/**'
      - 'tests/foundation/**'
      - 'tests/conftest.py'
      - 'tests/fixtures/**'
      - 'clients/pi-cogniverse/package-lock.json'
      - 'tests/utils/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/runtime-tests.yml'
      # Several unit modules read the shipped config; test_wiki_router.py also
      # the chart config; test_batch_optimization_lookback.py and
      # test_entity_extraction_ground_truth_fixture.py read e2e sources and
      # fixtures, the latter also the retrieval-query corpus.
      - 'configs/config.json'
      - 'charts/cogniverse/files/config.json'
      - 'tests/e2e/test_batch_optimization_e2e.py'
      - 'tests/e2e/data/entity_extraction_ground_truth.json'
      - 'data/testset/evaluation/sample_videos_retrieval_queries.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'libs/runtime/**'
      - 'libs/core/**'
      - 'libs/foundation/**'
      - 'configs/schemas/**'
      - 'configs/agent_policies/**'
      - 'workflows/**'
      - 'tests/runtime/**'
      - 'tests/admin/**'
      - 'tests/events/**'
      - 'tests/foundation/**'
      - 'tests/conftest.py'
      - 'tests/fixtures/**'
      - 'clients/pi-cogniverse/package-lock.json'
      - 'tests/utils/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      # Several unit modules read the shipped config; test_wiki_router.py also
      # the chart config; test_batch_optimization_lookback.py and
      # test_entity_extraction_ground_truth_fixture.py read e2e sources and
      # fixtures, the latter also the retrieval-query corpus.
      - 'configs/config.json'
      - 'charts/cogniverse/files/config.json'
      - 'tests/e2e/test_batch_optimization_e2e.py'
      - 'tests/e2e/data/entity_extraction_ground_truth.json'
      - 'data/testset/evaluation/sample_videos_retrieval_queries.json'

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm
        uv pip install pytest-cov

    - name: Run unit tests
      timeout-minutes: 25
      run: |
        JAX_PLATFORM_NAME=cpu uv run python -m pytest \
          tests/runtime/unit/ \
          tests/admin/unit/ \
          tests/foundation/unit/ \
          tests/events/unit/ \
          -v --tb=short \
          --cov=libs/runtime/cogniverse_runtime \
          --cov-report=term-missing \
          --cov-report=xml:coverage_runtime.xml

    - name: Upload coverage XML
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-runtime-xml
        path: coverage_runtime.xml
        retention-days: 7
        if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm

    - name: Run linting
      run: |
        uv run ruff check libs/runtime/cogniverse_runtime

  test-imports:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm

    - name: Test module imports
      run: |
        uv run python -c "from cogniverse_runtime.main import app; print('Runtime app import successful')"
        uv run python -c "from cogniverse_runtime.routers.search import router; print('Search router import successful')"
        uv run python -c "from cogniverse_runtime.routers.health import router; print('Health router import successful')"
        echo "All runtime imports successful"

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    # tests/runtime/integration/test_pi_agent_loop.py installs the pinned Pi
    # packages from clients/pi-cogniverse/package-lock.json, which declare
    # engines.node >= 22.19.0.
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: clients/pi-cogniverse/package-lock.json

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm

    - name: Free up disk space for Vespa
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    - name: Pre-pull Vespa Docker image
      run: |
        docker pull vespaengine/vespa:8.668.5
        df -h

    - name: Cache Ollama binary and test model
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ollama-qwen2.5-0.5b-v1

    - name: Run integration tests
      timeout-minutes: 25
      env:
        TEST_LLM_MODEL: "qwen2.5:0.5b"
      run: |
        JAX_PLATFORM_NAME=cpu uv run --no-sync python -m pytest \
          tests/runtime/integration/ \
          -m "integration and ci_fast and not requires_lm" \
          -v --tb=short

    - name: Run admin integration tests
      timeout-minutes: 20
      env:
        TEST_LLM_MODEL: "qwen2.5:0.5b"
      run: |
        JAX_PLATFORM_NAME=cpu uv run --no-sync python -m pytest \
          tests/admin/ \
          -m "integration" \
          -v --tb=short

    - name: Run platform integration tests
      timeout-minutes: 10
      run: |
        # Small self-contained suites (no heavy model sidecars); memory
        # integration needs the vLLM DenseOn sidecar and stays local-tier.
        JAX_PLATFORM_NAME=cpu uv run --no-sync python -m pytest \
          tests/events/integration/ \
          tests/foundation/integration/ \
          -v --tb=short
