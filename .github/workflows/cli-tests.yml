name: CLI Tests

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'libs/cli/**'
      - 'libs/core/**'
      - 'libs/foundation/**'
      # index.py runs the graph extractors in-process.
      - 'libs/agents/cogniverse_agents/graph/**'
      - 'tests/cli/**'
      - 'tests/conftest.py'
      - 'tests/fixtures/**'
      - 'tests/utils/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/cli-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'libs/cli/**'
      - 'libs/core/**'
      - 'libs/foundation/**'
      - 'libs/agents/cogniverse_agents/graph/**'
      - 'tests/cli/**'
      - 'tests/conftest.py'
      - 'tests/fixtures/**'
      - 'tests/utils/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/cli-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm

    # No -m marker filter: a file lacking the marker would silently stop
    # running in CI while still passing locally. The integration suite is
    # real-process/real-subprocess; the secrets-sync tests boot their own
    # Kubernetes API server (agentless k3s in Docker) and the runner ships
    # docker + kubectl, so it runs here too.
    - name: Run unit and integration tests
      run: |
        JAX_PLATFORM_NAME=cpu uv run python -m pytest \
          tests/cli/unit/ tests/cli/integration/ \
          -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm

    - name: Run linting
      run: |
        uv run ruff check libs/cli/cogniverse_cli
        uv run ruff format --check libs/cli/cogniverse_cli

  console-script:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --all-packages --all-extras --no-extra cuda --no-extra rocm

    - name: Walk the command tree
      run: |
        uv run cogniverse --help
        for cmd in up down start stop status logs index code secrets sandbox graph admin; do
          uv run cogniverse "$cmd" --help
        done
