apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tenant-provisioning
  namespace: cogniverse
spec:
  entrypoint: provisioning-pipeline

  arguments:
    parameters:
    - name: runtime-image
      value: "cogniverse/runtime:dev"
    - name: tenant-id
      value: ""
    - name: tenant-name
      value: ""
    - name: profiles
      value: "video_colpali_smol500_mv_frame,video_xclip_sv_chunk_6s"
    # Semantic-router tier the tenant is provisioned on (default | free | pro).
    - name: tier
      value: "default"
    - name: storage-quota
      value: "100Gi"
    - name: cpu-quota
      value: "10"
    - name: memory-quota
      value: "20Gi"

  templates:
  # Main provisioning pipeline
  - name: provisioning-pipeline
    steps:
    - - name: validate-tenant
        template: validate-tenant
    - - name: create-namespace
        template: create-namespace
    - - name: deploy-schemas
        template: deploy-schemas
    - - name: create-phoenix-project
        template: create-phoenix-project
    - - name: setup-resource-quotas
        template: setup-resource-quotas
    - - name: create-storage
        template: create-storage
    - - name: initialize-memory
        template: initialize-memory
    - - name: set-tier
        template: set-tier
    - - name: verify-namespace
        template: verify-namespace
    - - name: verify-storage
        template: verify-storage
    - - name: verify-tenant
        template: verify-tenant
    - - name: notify-completion
        template: notify-completion

  # Validate tenant configuration
  - name: validate-tenant
    container:
      image: "{{workflow.parameters.runtime-image}}"
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          echo "Validating tenant configuration..."

          # Check tenant ID format
          if [[ ! "{{workflow.parameters.tenant-id}}" =~ ^[a-z0-9_]+$ ]]; then
            echo "ERROR: Invalid tenant ID format (use lowercase alphanumeric and underscores)"
            exit 1
          fi

          echo "Tenant validation passed"
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1"

  # Create Kubernetes namespace for tenant
  - name: create-namespace
    resource:
      action: create
      manifest: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: cogniverse-{{workflow.parameters.tenant-id}}
          labels:
            tenant: "{{workflow.parameters.tenant-id}}"
            managed-by: cogniverse

  # Deploy Vespa schemas for tenant. Each profile's schema goes through
  # SchemaRegistry, the same seam POST /admin/profiles/{name}/deploy uses,
  # so it lands under its tenant-scoped name beside every other tenant's
  # schema instead of replacing the application package.
  - name: deploy-schemas
    container:
      image: "{{workflow.parameters.runtime-image}}"
      command: ["python", "-m", "cogniverse_runtime.provision_tenant"]
      args:
        - --step
        - schemas
        - --tenant-id
        - "{{workflow.parameters.tenant-id}}"
        - --profiles
        - "{{workflow.parameters.profiles}}"
      env:
      - name: BACKEND_URL
        value: "http://cogniverse-vespa"
      - name: BACKEND_PORT
        value: "8080"
      - name: VESPA_CONFIG_PORT
        value: "19071"
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "4Gi"
          cpu: "2"

  # Create Phoenix project for tenant
  - name: create-phoenix-project
    container:
      image: "{{workflow.parameters.runtime-image}}"
      command: ["python", "-m", "cogniverse_runtime.provision_tenant"]
      args:
        - --step
        - telemetry
        - --tenant-id
        - "{{workflow.parameters.tenant-id}}"
      env:
      - name: TELEMETRY_OTLP_ENDPOINT
        value: "cogniverse-phoenix:4317"
      - name: TELEMETRY_HTTP_ENDPOINT
        value: "http://cogniverse-phoenix:6006"
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1"

  # Setup resource quotas
  - name: setup-resource-quotas
    resource:
      action: create
      manifest: |
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: tenant-quota
          namespace: cogniverse-{{workflow.parameters.tenant-id}}
        spec:
          hard:
            requests.cpu: "{{workflow.parameters.cpu-quota}}"
            requests.memory: "{{workflow.parameters.memory-quota}}"
            requests.storage: "{{workflow.parameters.storage-quota}}"
            persistentvolumeclaims: "10"
            pods: "50"

  # Create storage for tenant
  - name: create-storage
    resource:
      action: create
      manifest: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: tenant-data
          namespace: cogniverse-{{workflow.parameters.tenant-id}}
          labels:
            tenant: "{{workflow.parameters.tenant-id}}"
        spec:
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: {{workflow.parameters.storage-quota}}
          storageClassName: standard

  # Initialize Mem0 memory system for tenant
  - name: initialize-memory
    container:
      image: "{{workflow.parameters.runtime-image}}"
      command: ["python", "-m", "cogniverse_runtime.provision_tenant"]
      args:
        - --step
        - memory
        - --tenant-id
        - "{{workflow.parameters.tenant-id}}"
      env:
      - name: BACKEND_URL
        value: "http://cogniverse-vespa"
      - name: BACKEND_PORT
        value: "8080"
      - name: VESPA_CONFIG_PORT
        value: "19071"
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "4Gi"
          cpu: "2"

  # Store the tenant's semantic-router tier through the same seam the admin
  # route writes, so the router serves the tenant on it from the first request.
  - name: set-tier
    container:
      image: "{{workflow.parameters.runtime-image}}"
      command: ["python", "-m", "cogniverse_runtime.provision_tenant"]
      args:
        - --step
        - tier
        - --tier
        - "{{workflow.parameters.tier}}"
        - --tenant-id
        - "{{workflow.parameters.tenant-id}}"
      env:
      - name: BACKEND_URL
        value: "http://cogniverse-vespa"
      - name: BACKEND_PORT
        value: "8080"
      - name: VESPA_CONFIG_PORT
        value: "19071"
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1"

  # Verify tenant provisioning. The namespace and the claim are read back
  # through Argo resource templates (the runtime image ships no kubectl),
  # and each profile's tenant schema is checked through the same registry
  # that deployed it.
  - name: verify-namespace
    resource:
      action: get
      manifest: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: cogniverse-{{workflow.parameters.tenant-id}}

  - name: verify-storage
    resource:
      action: get
      manifest: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: tenant-data
          namespace: cogniverse-{{workflow.parameters.tenant-id}}

  - name: verify-tenant
    container:
      image: "{{workflow.parameters.runtime-image}}"
      command: ["python", "-m", "cogniverse_runtime.provision_tenant"]
      args:
        - --step
        - verify
        - --tenant-id
        - "{{workflow.parameters.tenant-id}}"
        - --profiles
        - "{{workflow.parameters.profiles}}"
      env:
      - name: BACKEND_URL
        value: "http://cogniverse-vespa"
      - name: BACKEND_PORT
        value: "8080"
      - name: VESPA_CONFIG_PORT
        value: "19071"
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1"

  # Send completion notification
  - name: notify-completion
    container:
      image: curlimages/curl:8.11.1
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Tenant provisioning completed"
          echo "Tenant ID: {{workflow.parameters.tenant-id}}"
          echo "Tenant Name: {{workflow.parameters.tenant-name}}"
          echo "Profiles: {{workflow.parameters.profiles}}"
          echo "Storage: {{workflow.parameters.storage-quota}}"
          echo "CPU Quota: {{workflow.parameters.cpu-quota}}"
          echo "Memory Quota: {{workflow.parameters.memory-quota}}"

          # Send notification
          # curl -X POST https://your-webhook-url \
          #   -H "Content-Type: application/json" \
          #   -d '{
          #     "workflow": "tenant-provisioning",
          #     "tenant_id": "{{workflow.parameters.tenant-id}}",
          #     "tenant_name": "{{workflow.parameters.tenant-name}}",
          #     "status": "completed"
          #   }'
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
---
# Example Workflow submission
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: tenant-provisioning-
  namespace: cogniverse
spec:
  workflowTemplateRef:
    name: tenant-provisioning
  arguments:
    parameters:
    - name: tenant-id
      value: "newcorp_inc"
    - name: tenant-name
      value: "NewCorp Inc"
    - name: profiles
      value: "video_colpali_smol500_mv_frame,video_xclip_sv_chunk_6s"
    - name: storage-quota
      value: "200Gi"
    - name: cpu-quota
      value: "20"
    - name: memory-quota
      value: "40Gi"
