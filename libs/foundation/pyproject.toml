[project]
name = "cogniverse-foundation"
dynamic = ["version"]
description = "Cogniverse Foundation - Cross-cutting concerns and shared infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cogniverse-sdk",
    "dspy-ai==3.4.0",
    "dspy[optuna]==3.4.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.41.0",
    "opentelemetry-sdk==1.41.0",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.49",
    "pandas==2.3.3",
]

[tool.uv.sources]
cogniverse-sdk = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Package lives at libs/<pkg>; the git repo (tag source) is two levels up.
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["cogniverse_foundation"]
