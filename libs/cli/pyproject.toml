[project]
name = "cogniverse-cli"
dynamic = ["version"]
description = "CLI for deploying and managing Cogniverse"
requires-python = ">=3.12"
dependencies = [
    "click==8.1.8",
    "cogniverse-foundation",
    "fastapi==0.135.3",
    "rich==14.3.4",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "modal==1.4.1",
    "pathspec==1.0.4",
    "pyyaml==6.0.3",
    "setuptools-scm>=8",
]

[tool.uv.sources]
cogniverse-foundation = { workspace = true }

[project.scripts]
cogniverse = "cogniverse_cli.main:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Package lives at libs/<pkg>; the git repo (tag source) is two levels up.
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["cogniverse_cli"]
artifacts = [
    "cogniverse_cli/data/**",
]
